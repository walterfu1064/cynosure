    [project]
    name = "wave-physics"
    version = "0.1.0"
    description = "PyTorch-based tools for simulating optical aberrations in high-NA imaging systems"
    readme = "README.md"
    requires-python = ">=3.14"
    dependencies = [
        "torch>=2.11.0",
    ]

    [build-system]
    requires = ["hatchling"]
    build-backend = "hatchling.build"

    [tool.hatch.build.targets.wheel]
    packages = ["src/czt", "src/zernike", "src/beam_propagation"]

    [dependency-groups]
    dev = [
        "jupyter>=1.1.1",
        "matplotlib>=3.10.8",
        "numpy>=2.4.4",
        "pytest>=9.0.3",
    ]