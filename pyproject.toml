    [project]
    name = "cynosure"
    version = "0.1.0"
    description = "Differentiable high-NA PSF modeling and Zernike aberration retrieval in PyTorch. Classical phase retrieval and amortized simulation-based inference."
    readme = "README.md"
    requires-python = ">=3.14"
    dependencies = [
        "numpy>=2.4.4",
        "pandas>=3.0.5",
        "pytorch-lightning>=2.6.5",
        "scipy>=1.17.1",
        "tifffile>=2026.6.1",
        "torch>=2.11.0",
        "tqdm>=4.68.4",
]

    [build-system]
    requires = ["hatchling"]
    build-backend = "hatchling.build"

    [tool.hatch.build.targets.wheel]
    packages = ["src/cynosure"]

    [dependency-groups]
    dev = [
        "jupyter>=1.1.1",
        "matplotlib>=3.10.8",
        "pytest>=9.0.3",
    ]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
